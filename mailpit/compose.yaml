name: mailpit
services:
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

volumes:
  mailpit-data:
