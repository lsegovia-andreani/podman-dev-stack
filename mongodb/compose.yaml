name: mongodb
services:
  mongodb:
    image: mirror.gcr.io/library/mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: developer
      MONGO_INITDB_ROOT_PASSWORD: Puppy.1518
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u developer -p 'Puppy.1518' --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongodb-data:
